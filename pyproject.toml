[project]
name = "genome-tools"
version = "3.0.0"
description = "A toolkit for genome analysis and manipulation."
authors = [
    { name = "Jeff Vierstra", email = "jvierstra@altius.org" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["genome", "bioinformatics", "analysis", "toolkit"]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pysam",
    "pyBigWig",
    "matplotlib",
    "descartes",
    "fonttools>=4.60.2",
    "openpyxl",
    "shapely>=2.0.5",
    "makefun",
    "tqdm",
    "pyarrow"
]

[project.optional-dependencies]
figwig = ["figwig; python_version >= '3.10'"]
anndata = ["anndata>=0.10.9", "zarr>=2.18.3,<3", "dask"]
pyranges = ["pyranges"]
sampling = ["numba"]

[project.urls]
Homepage = "https://github.com/vierstralab/genome-tools"
Repository = "https://github.com/vierstralab/genome-tools"
Issues = "https://github.com/vierstralab/genome-tools/issues"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
include = ["genome_tools*"]

[tool.setuptools.package-data]
"genome_tools.plotting.modular_plot" = ["README.md", "README_develop.md"]

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend-exclude = [".vscode", "__pycache__",]